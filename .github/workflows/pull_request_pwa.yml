name: On pull request (PWA)

on:
  # It needs to be pull_request_target because we need access to the repo variables in forks.
  # pull_request_target runs on the base branch; pull_request runs on the head branch (fork).
  pull_request_target:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-pwa-${{ github.head_ref }}
  cancel-in-progress: true

env:
  VITE_TBA_API_READ_KEY: ${{ vars.VITE_TBA_API_READ_KEY }}
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
  VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}

jobs:
  # This workflow file always comes from main (pull_request_target), so test the PR merged
  # into main, as the pull_request workflow does. Otherwise an old branch runs main's CI
  # setup against its own stale config. The payload's merge_commit_sha can lag a push, so
  # wait until GitHub's test merge commit has the current head as its second parent. A
  # conflicting PR has no merge commit and is tested at its head.
  pwa-ref:
    name: "[pwa] Resolve commit to test"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha="$HEAD_SHA"
          for _ in $(seq 1 12); do
            read -r mergeable merge < <(gh api "repos/$REPO/pulls/$PR" --jq '"\(.mergeable) \(.merge_commit_sha)"')
            if [ "$mergeable" = "false" ]; then
              echo "PR conflicts with its base; testing the head commit."
              break
            fi
            if [ "$mergeable" = "true" ] && [ "$merge" != "null" ]; then
              parent=$(gh api "repos/$REPO/commits/$merge" --jq '.parents[1].sha')
              if [ "$parent" = "$HEAD_SHA" ]; then
                sha="$merge"
                break
              fi
            fi
            sleep 5
          done
          echo "Testing $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  pwa-lint:
    needs: pwa-ref
    name: "[pwa] Format & Lint"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pwa-ref.outputs.sha }}
          allow-unsafe-pr-checkout: true

      - name: Check toolchain version consistency
        run: ./ops/pwa/check_node_versions.sh

      - name: Set up PWA toolchain
        uses: ./.github/actions/setup-pwa

      - name: Create dotenv
        run: ./ops/pwa/create_dotenv.sh --env

      - name: Install Dependencies
        run: pnpm --dir pwa install --frozen-lockfile

      - name: Run Format
        run: pnpm --dir pwa run format

      - name: Run Lint
        run: pnpm --dir pwa run lint

  pwa-type:
    needs: pwa-ref
    name: "[pwa] Type Check"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pwa-ref.outputs.sha }}
          allow-unsafe-pr-checkout: true

      - name: Set up PWA toolchain
        uses: ./.github/actions/setup-pwa

      - name: Create dotenv
        run: ./ops/pwa/create_dotenv.sh --env

      - name: Install Dependencies
        run: pnpm --dir pwa install --frozen-lockfile

      - name: Run Type Check
        run: pnpm --dir pwa run typecheck

  pwa-test:
    needs: pwa-ref
    name: "[pwa] Test"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pwa-ref.outputs.sha }}
          allow-unsafe-pr-checkout: true

      - name: Set up PWA toolchain
        uses: ./.github/actions/setup-pwa

      - name: Install Dependencies
        run: pnpm --dir pwa install --frozen-lockfile

      - name: Create dotenv
        run: ./ops/pwa/create_dotenv.sh --env

      - name: Run Test
        run: pnpm --dir pwa test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./pwa/coverage/
          flags: pwa

  pwa-build:
    needs: pwa-ref
    name: "[pwa] Build"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pwa-ref.outputs.sha }}
          allow-unsafe-pr-checkout: true

      - name: Set up PWA toolchain
        uses: ./.github/actions/setup-pwa

      - name: Install Dependencies
        run: pnpm --dir pwa install --frozen-lockfile

      - name: Create dotenv
        run: ./ops/pwa/create_dotenv.sh --env

      - name: Run Build
        run: pnpm --dir pwa run build

  check-pwa-api:
    needs: pwa-ref
    name: "[pwa] Check API regeneration"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pwa-ref.outputs.sha }}
          allow-unsafe-pr-checkout: true

      - name: Set up PWA toolchain
        uses: ./.github/actions/setup-pwa

      - name: Create dotenv
        run: ./ops/pwa/create_dotenv.sh --env

      - name: Install Dependencies
        working-directory: pwa
        run: pnpm install --frozen-lockfile

      - name: Run generate-api.sh
        working-directory: ./pwa
        run: ./generate-api.sh

      - name: Detect changes in pwa/app/api
        run: |
          CHANGED_FILES=$(git diff --name-only pwa/app/api)
          if [[ -n "$CHANGED_FILES" ]]; then
            echo "::error title=API Mismatch::Files changed in pwa/app/api:"
            echo "$CHANGED_FILES"
            exit 1
          else
            echo "No changes detected in pwa/app/api."
          fi

  pwa-playwright:
    needs: pwa-ref
    name: "[pwa] Playwright Tests"
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pwa-ref.outputs.sha }}
          allow-unsafe-pr-checkout: true

      - name: Set up PWA toolchain
        uses: ./.github/actions/setup-pwa

      - name: Create dotenv
        run: ./ops/pwa/create_dotenv.sh --env

      - name: Install Dependencies
        working-directory: pwa
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: pwa
        run: pnpm exec playwright install --only-shell chromium

      - name: Build application
        working-directory: pwa
        run: pnpm run build

      - name: Run Playwright tests
        working-directory: pwa
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
