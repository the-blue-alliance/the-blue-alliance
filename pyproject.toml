[project]
name = "the-blue-alliance"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "appengine-python-standard==3.1.0",
    "beautifulsoup4==4.15.0",
    "firebase-admin==7.8.0",
    "flask==3.1.3",
    "flask-caching==2.5.1",
    "flask-cors==6.0.5",
    "flask-wtf==1.3.0",
    "google-api-core==2.44.0",
    "google-api-python-client==2.202.0",
    "google-cloud-logging==3.17.0",
    "google-cloud-run==0.16.3",
    "grpcio==1.85.3",
    "gunicorn==27.0.1",
    "jinja2==3.1.6",
    "markupsafe==3.0.4",
    "numpy==2.5.5",
    "oauth2client==4.1.3",
    "openpyxl==3.1.5",
    "orjson==3.13.0",
    "pydantic==2.14.4",
    "pyre-extensions==0.0.32",
    "pytz==2026.6",
    "requests==2.34.2",
    "six==1.17.0",
    "typing-extensions==4.16.0",
    "tzlocal==5.4.5",
    "werkzeug==3.1.6",
]

[dependency-groups]
test = [
    "freezegun==1.5.5",
    "pytest",
    "pytest-custom_exit_code",
    "pytest-split",
    "pytest-testmon",
    "pytest-xdist>=3.8.0",
    "requests-mock==1.12.1",
]
ci = [
    { include-group = "test" },
    "pytest-cov",
]
lint = [
    "black==26.10.1",
    "flake8==7.5.0",
    "flake8-import-order",
    "flake8-tidy-imports",
]
typecheck = [
    { include-group = "webpack" },
    "pyre-check==0.10.0",
]
webpack = [
    "watchdog==7.1.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    "pre-commit",
]

[tool.black]
# Targeting 3.14 makes black rewrite `except (A, B):` as PEP 758's
# `except A, B:`, which pyre-check 0.10.0 can't parse. Raise this once it can.
target-version = ["py313"]
