service: py3-api
runtime: python313
entrypoint: gunicorn -t 0 -b :$PORT --workers 1 --threads 4 backend.api.main:app
app_engine_apis: true

inbound_services:
  - warmup

instance_class: F1
automatic_scaling:
  min_pending_latency: 1.5s
  max_pending_latency: 2.5s
  max_idle_instances: 1
  target_cpu_utilization: 0.9
  target_throughput_utilization: 0.9
  max_concurrent_requests: 10

handlers:
  - url: .*
    script: auto

includes:
  - env_variables.yaml
